<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Job Queue | Idrizi DFW Roadside</title>
<style>
  :root{color-scheme:light dark;--paper:#F5F5F7;--card:#fff;--ink:#1D1D1F;--muted:#5C5C61;--line:rgba(60,60,67,.18);--navy:#0B1F44;--tint:#0B1F44;--gold:#F2B705;--new:#D70015;--quoted:#B25E00;--booked:#0A6CFF;--done:#1E7B34}
  @media (prefers-color-scheme:dark){:root{--paper:#000;--card:#1C1C1E;--ink:#F5F5F7;--muted:#A1A1A6;--line:rgba(235,235,245,.16);--navy:#12306B;--tint:#F2B705;--new:#FF453A;--quoted:#FF9F0A;--booked:#4DA3FF;--done:#32D74B}}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 20px calc(48px + env(safe-area-inset-bottom))}
  h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .sub{color:var(--muted);margin:6px 0 18px}
  .group{background:var(--card);border-radius:16px;overflow:hidden}
  textarea{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;padding:14px 16px;min-height:76px;resize:none;outline:none}
  textarea::placeholder{color:#8E8E93}
  .btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:var(--navy);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  .btn:active{opacity:.8}
  .seg{display:flex;background:var(--line);border-radius:10px;padding:2px;margin:18px 0 12px}
  .seg button{flex:1;min-height:40px;border:0;border-radius:8px;background:transparent;color:var(--ink);font:inherit;font-weight:600;font-size:15px;cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .msg{color:var(--muted);font-size:15px;margin:8px 4px}
  .card{background:var(--card);border-radius:16px;margin-top:12px;overflow:hidden}
  .top{padding:14px 16px 6px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .nm{font-weight:700;font-size:19px}
  .badge{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px;color:#fff;white-space:nowrap}
  .s-New{background:var(--new)}.s-Quoted{background:var(--quoted)}.s-Booked{background:var(--booked)}.s-Done{background:var(--done)}
  .body{padding:0 16px 12px;color:var(--muted);font-size:15px}
  .body b{color:var(--ink);font-weight:600}
  .dist{color:var(--ink);font-weight:700}
  .acts{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px 14px;border-top:.5px solid var(--line)}
  .acts a,.acts button{padding:9px 14px;border-radius:999px;background:var(--tint);color:var(--card);font:inherit;font-weight:700;font-size:14px;text-decoration:none;border:0;cursor:pointer}
  .acts .o{background:transparent;color:var(--tint);border:1.5px solid var(--tint)}
  .acts .x{background:transparent;color:var(--new);border:0;margin-left:auto}
  .fin{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px 0;border-top:.5px solid var(--line)}
  .fin label{font-size:12px;color:var(--muted)}
  .fin .wide{grid-column:1 / -1}
  .fin input{width:100%;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;padding:9px 10px}
  :focus-visible{outline:3px solid var(--tint);outline-offset:2px;border-radius:10px}
  .link{display:block;text-align:center;margin-top:24px;color:var(--muted);font-size:15px}
  .gate{padding:16px}
  .gate input{width:100%;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:inherit;font-size:22px;letter-spacing:.3em;text-align:center;padding:14px}
  .banner{position:sticky;top:calc(8px + env(safe-area-inset-top));z-index:5;background:var(--gold);color:#0B1F44;font-weight:700;border-radius:14px;padding:12px 16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .conf{color:var(--done);font-weight:700}
</style>
</head>
<body>
<main class="wrap">
  <h1>Job Queue</h1>
  <p class="sub" id="sub">Requests from the website show up here on their own.</p>
  <div id="banner" class="banner" hidden role="status"></div>

  <section id="gate" hidden>
    <div class="group gate"><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN"></div>
    <button class="btn" id="unlock" type="button" style="margin-top:10px">Unlock</button>
    <p class="msg" id="gatemsg" hidden></p>
  </section>

  <section id="app" hidden>
    <div class="group"><textarea id="req" placeholder="Got a request by text? Paste it here"></textarea></div>
    <button class="btn" id="paste" type="button" style="margin-top:10px">Paste and add to queue</button>
    <p class="msg" id="addmsg" hidden></p>

    <div class="seg" id="tabs" role="group" aria-label="View">
      <button type="button" data-t="active" aria-pressed="true">Active <span id="nA"></span></button>
      <button type="button" data-t="done" aria-pressed="false">Done <span id="nD"></span></button>
    </div>
    <div class="seg" id="sorts" role="group" aria-label="Sort" style="margin-top:0">
      <button type="button" data-s="order" aria-pressed="true">In order received</button>
      <button type="button" data-s="near" aria-pressed="false">Nearest to me</button>
    </div>
    <p class="msg" id="nearmsg" hidden></p>
    <div id="list"></div>
    <button class="link" id="lock" type="button" style="background:none;border:0;width:100%">Lock this page</button>
    <a class="link" href="quote.html" style="margin-top:8px">Open the quote page</a>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let pin = ""; try { pin = localStorage.getItem("idrizi_pin") || ""; } catch(e){}
let jobs = [], tab = "active", sort = "order", me = null, known = null, timer = null, bannerT = null;

class AuthError extends Error {}
async function api(body){
  const r = await fetch("/api/jobs", { method: body ? "POST" : "GET", headers: { "x-queue-pin": pin, "content-type": "application/json" }, body: body && JSON.stringify(body) });
  if (r.status === 401) throw new AuthError("pin");
  if (r.status === 503) throw new Error("not_configured");
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || "error"); e.status = r.status; throw e; }
  return d;
}
const note = (el, t) => { el.textContent = t; el.hidden = !t; };
function showGate(msg){ clearInterval(timer); $("gate").hidden = false; $("app").hidden = true; note($("gatemsg"), msg || ""); $("pin").focus(); }
function banner(t){ const b = $("banner"); b.textContent = t; b.hidden = false; try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch(e){} clearTimeout(bannerT); bannerT = setTimeout(() => b.hidden = true, 12000); }

function miles(a, b){
  const R = 3958.8, rad = x => x * Math.PI / 180, dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h)) * 1.3;
}
function ago(ts){
  const m = Math.max(0, Math.round((Date.now() - ts) / 60000));
  if (m < 1) return "just now"; if (m < 60) return m + " min ago";
  const h = Math.floor(m / 60); return h < 24 ? h + " hr ago" : Math.floor(h / 24) + " d ago";
}

async function load(first){
  try {
    const d = await api(); const list = d.jobs;
    if (known) {
      list.forEach(j => {
        const old = known.get(j.id);
        if (!old) banner("New request: " + (j.name || "Customer") + ", " + j.service);
        else if (j.confirmed && !old.confirmed) banner((j.name || "Customer") + " booked the " + j.service.toLowerCase());
      });
    }
    known = new Map(list.map(j => [j.id, { confirmed: !!j.confirmed }]));
    jobs = list;
    jobs.filter(j => j.status === "Booked" && j.confirmed && !j.sched).forEach(j => upd(j, { sched: toInput(nextQuarter()) }));
    const nNew = jobs.filter(j => j.status === "New").length;
    document.title = (nNew ? "(" + nNew + ") " : "") + "Job Queue | Idrizi DFW Roadside";
    const a = document.activeElement;
    if (first || !(a && a.closest && a.closest("#list") && /INPUT|TEXTAREA/.test(a.tagName))) render();
    note($("sub"), ""); $("sub").hidden = false; $("sub").textContent = "Requests from the website show up here on their own.";
  } catch (e) {
    if (e instanceof AuthError) { try { localStorage.removeItem("idrizi_pin"); } catch(x){} pin = ""; showGate("That PIN didn't work."); }
    else if (e.message === "not_configured") { $("sub").textContent = "Not set up yet. The PIN hasn't been added in Netlify."; }
    else { $("sub").textContent = "No connection. Showing the last list. Retrying..."; }
  }
}
async function start(){
  $("gate").hidden = true; $("app").hidden = false;
  await migrate(); await load(true);
  clearInterval(timer); timer = setInterval(() => { if (!document.hidden) load(); }, 15000);
}
async function migrate(){
  try {
    const old = JSON.parse(localStorage.getItem("idrizi_jobs") || "[]");
    if (Array.isArray(old) && old.length) { await api({ action: "import", jobs: old.map(j => ({ raw: j.raw, ts: j.ts, status: j.status, price: j.price, miles: j.miles, sched: j.sched })) }); }
    localStorage.removeItem("idrizi_jobs");
  } catch(e){}
}
$("unlock").onclick = async () => {
  pin = $("pin").value.trim(); if (!pin) return;
  $("unlock").disabled = true;
  try { await api(); try { localStorage.setItem("idrizi_pin", pin); } catch(e){} $("pin").value = ""; await start(); }
  catch (e) { note($("gatemsg"), e instanceof AuthError ? "That PIN didn't work." : e.message === "not_configured" ? "Not set up yet. The PIN hasn't been added in Netlify." : "No connection. Try again."); }
  $("unlock").disabled = false;
};
$("pin").addEventListener("keydown", e => { if (e.key === "Enter") $("unlock").click(); });
$("lock").onclick = () => { try { localStorage.removeItem("idrizi_pin"); } catch(e){} pin = ""; known = null; showGate(""); };

$("paste").onclick = async () => {
  let t = $("req").value;
  if (!t.trim()) { try { t = await navigator.clipboard.readText(); } catch(e){ $("req").focus(); note($("addmsg"), "Press and hold in the box, tap Paste, then tap this button again."); return; } }
  try {
    const r = await api({ action: "create", raw: t });
    $("req").value = ""; note($("addmsg"), r.existing ? "That one is already in the queue." : "Added to the queue.");
    await load(true);
  } catch (e) { note($("addmsg"), e.status === 422 ? "That doesn't look like a request text. Copy the whole message from Messages and try again." : "Couldn't add it. Check your signal and try again."); }
  setTimeout(() => note($("addmsg"), ""), 3500);
};

function locate(cb){
  if (!navigator.geolocation) { note($("nearmsg"), "This phone can't share its location."); return; }
  note($("nearmsg"), "Finding your location...");
  navigator.geolocation.getCurrentPosition(p => { me = { lat: p.coords.latitude, lng: p.coords.longitude }; note($("nearmsg"), ""); cb && cb(); },
    () => { note($("nearmsg"), "Location is off. Allow location for this site, then tap Nearest again."); sort = "order"; render(); }, { enableHighAccuracy: true, timeout: 10000 });
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
document.querySelectorAll("#sorts button").forEach(b => b.onclick = () => {
  sort = b.dataset.s;
  if (sort === "near") locate(render); else note($("nearmsg"), "");
  render();
});

const NEXT = { New: "Mark quoted", Quoted: "Mark booked", Booked: "Mark done" };
const AFTER = { New: "Quoted", Quoted: "Booked", Booked: "Done" };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
const line = (label, val) => { const d = el("div"); d.append(el("b", "", label + ": "), document.createTextNode(val)); return d; };

async function upd(j, patch){
  Object.assign(j, patch);
  try { const r = await api({ action: "update", id: j.id, patch }); Object.assign(j, r.job); } catch(e){ if (e instanceof AuthError) showGate("That PIN didn't work."); }
}
const pad2 = n => String(n).padStart(2, "0");
const localStr = d => d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate()) + "T" + pad2(d.getHours()) + pad2(d.getMinutes()) + "00";
const icsEsc = t => String(t || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
const nextQuarter = () => { const d = new Date(); d.setSeconds(0, 0); d.setMinutes(Math.ceil((d.getMinutes() + 1) / 15) * 15); return d; };
const toInput = d => d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()) + "T" + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
function addToCalendar(j){
  const start = new Date(j.sched), end = new Date(start.getTime() + 60 * 60000);
  const desc = [j.phone && "Phone: " + j.phone, j.veh && "Vehicle: " + j.veh, j.vin && "VIN: " + j.vin, j.map && "Map: " + j.map, j.notes && "Notes: " + j.notes, j.price && "Quoted: $" + j.price].filter(Boolean).join("\n");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Idrizi DFW Roadside//Jobs//EN", "BEGIN:VEVENT", "UID:" + j.id + "@idrizidfwroadside", "DTSTAMP:" + localStr(new Date()),
    "DTSTART:" + localStr(start), "DTEND:" + localStr(end), "SUMMARY:" + icsEsc(j.service + " - " + (j.name || "Customer")), "LOCATION:" + icsEsc(j.loc), "DESCRIPTION:" + icsEsc(desc),
    "BEGIN:VALARM", "TRIGGER:-PT30M", "ACTION:DISPLAY", "DESCRIPTION:Job coming up", "END:VALARM", "END:VEVENT", "END:VCALENDAR"];
  const blob = new Blob([lines.join("\r\n")], { type: "text/calendar" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "job-" + (j.name || "customer").replace(/\W+/g, "-") + ".ics";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const fmtSched = v => new Date(v).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
function logRow(j){
  const d = new Date(j.ts), date = pad2(d.getMonth()+1) + "/" + pad2(d.getDate()) + "/" + d.getFullYear();
  return [date, j.name, j.phone, j.service, j.miles, j.price, "", "", [j.veh, j.notes].filter(Boolean).join(" | ")].join("\t");
}

function card(j){
  const c = el("div", "card");
  const top = el("div", "top"); top.append(el("div", "nm", j.name || "No name"), el("span", "badge s-" + j.status, j.status)); c.append(top);
  const b = el("div", "body");
  b.append(line("Service", j.service + (j.when ? " (" + j.when + ")" : "")));
  if (j.loc) b.append(line("Where", j.loc));
  if (j.veh) b.append(line("Vehicle", j.veh));
  const meta = el("div"); meta.append("Received " + ago(j.ts));
  if (me && j.lat != null) meta.append(el("span", "dist", " · about " + miles(me, j).toFixed(1) + " mi from you"));
  else if (sort === "near" && j.lat == null) meta.append(" · no map pin");
  b.append(meta);
  if (j.confirmed && j.status === "Booked") b.append(el("div", "conf", "Customer confirmed the quote"));
  if (j.sched && j.status !== "Done") b.append(line("Scheduled", fmtSched(j.sched)));
  c.append(b);

  if (j.status === "Booked" || j.status === "Done") {
    const fin = el("div", "fin");
    [["Price ($)", "price"], ["Miles driven", "miles"]].forEach(([lab, k]) => {
      const w = el("div"); const l = el("label", "", lab); const i = el("input"); i.type = "number"; i.inputMode = "decimal"; i.value = j[k] || "";
      let t; i.oninput = () => { j[k] = i.value; clearTimeout(t); t = setTimeout(() => upd(j, { [k]: i.value }), 700); }; w.append(l, i); fin.append(w);
    });
    if (j.status === "Booked") {
      const w = el("div", "wide"); const l = el("label", "", "Scheduled time"); const i = el("input"); i.type = "datetime-local"; i.value = j.sched || "";
      i.onchange = async () => { await upd(j, { sched: i.value }); render(); }; w.append(l, i); fin.append(w);
    }
    c.append(fin);
  }
  const a = el("div", "acts");
  const digits = (j.phone || "").replace(/\D/g, "");
  if (digits) { const x = el("a", "", "Call"); x.href = "tel:" + digits; a.append(x); const t = el("a", "o", "Text"); t.href = "sms:" + digits; a.append(t); }
  if (j.map) { const m = el("a", "o", "Maps"); m.href = j.map; m.target = "_blank"; m.rel = "noopener"; a.append(m); }
  if (j.status === "New" || j.status === "Quoted") {
    const q = el("button", "o", j.status === "Quoted" ? "Resend quote" : "Send quote"); q.type = "button";
    q.onclick = () => { try { localStorage.setItem("idrizi_pending", j.raw); localStorage.setItem("idrizi_pending_id", j.id); } catch(e){} location.href = "quote.html"; }; a.append(q);
  }
  if (j.status === "Booked" && j.sched) { const cal = el("button", "o", "Add to calendar"); cal.type = "button"; cal.onclick = () => addToCalendar(j); a.append(cal); }
  if (NEXT[j.status]) {
    const n = el("button", "", NEXT[j.status]); n.type = "button";
    n.onclick = async () => { const st = AFTER[j.status]; const patch = { status: st }; if (st === "Booked" && !j.sched) patch.sched = toInput(nextQuarter()); await upd(j, patch); render(); }; a.append(n);
  }
  if (j.status === "Done") {
    const cp = el("button", "", "Copy log row"); cp.type = "button";
    cp.onclick = async () => { try { await navigator.clipboard.writeText(logRow(j)); cp.textContent = "Copied"; } catch(e){ cp.textContent = "Copy failed"; } setTimeout(() => cp.textContent = "Copy log row", 2000); };
    a.append(cp);
    const re = el("button", "o", "Reopen"); re.type = "button"; re.onclick = async () => { await upd(j, { status: "Booked" }); render(); }; a.append(re);
  }
  const rm = el("button", "x", j.status === "Done" ? "Delete" : "Cancel job"); rm.type = "button";
  rm.onclick = async () => { if (!confirm("Remove this job from the list?")) return; try { await api({ action: "delete", id: j.id }); jobs = jobs.filter(z => z !== j); render(); } catch(e){} }; a.append(rm);
  c.append(a); return c;
}

function render(){
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === tab));
  document.querySelectorAll("#sorts button").forEach(b => b.setAttribute("aria-pressed", b.dataset.s === sort));
  $("sorts").hidden = tab !== "active";
  const act = jobs.filter(j => j.status !== "Done"), done = jobs.filter(j => j.status === "Done");
  $("nA").textContent = act.length ? "(" + act.length + ")" : ""; $("nD").textContent = done.length ? "(" + done.length + ")" : "";
  const list = tab === "active" ? act.slice() : done.slice().sort((a, b) => (b.doneTs || b.ts) - (a.doneTs || a.ts));
  if (tab === "active") {
    if (sort === "near" && me) list.sort((a, b) => (a.lat == null) - (b.lat == null) || (a.lat != null ? miles(me, a) - miles(me, b) : a.ts - b.ts));
    else list.sort((a, b) => a.ts - b.ts);
  }
  const box = $("list"); box.replaceChildren();
  if (!list.length) { box.append(el("p", "msg", tab === "active" ? "No open jobs. New requests from the website will appear here." : "No finished jobs yet.")); return; }
  list.forEach(j => box.append(card(j)));
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && pin && !$("app").hidden) load(); });
if (pin) start(); else showGate("");
</script>
</body>
</html>
